<!DOCTYPE html>
<!-- ====================================================================
  index.html : 산행안전 양자 실험실 v02 의 화면 뼈대
  - 왼쪽: 메뉴(사이드바)  /  오른쪽: 한 화면짜리 내용(스크롤 없이 보기)
  - 아래: 음성 안내 막대(재생, 일시정지, 정지, 속도, 목소리, 자막)
  - 스크립트는 ES 모듈이 아닌 일반 스크립트로 불러옴
    → 파일을 더블클릭해서 열어도(file://) 서버 없이 동작하게 하기 위함임
==================================================================== -->
<html lang="ko">
<head>
<meta charset="utf-8">                                         <!-- 한글이 깨지지 않도록 UTF-8을 씀 -->
<meta name="viewport" content="width=device-width,initial-scale=1"> <!-- 화면 폭에 맞춰 배치함 -->
<title>산행안전 양자 실험실 v02</title>                          <!-- 브라우저 탭 제목임 -->
<style>
/* =====================================================================
 * style.css : 화면 색감과 배치
 * 색 원칙 : 초록 일색을 피하고, 늦가을 낙엽(단풍 녹슨빛, 황토, 모래)과
 *          품격 있는 파스텔(자두, 라벤더, 장밋빛, 안개 하늘)을 섞음.
 *          일반 AI = 안개 청색, 양자 특징 AI = 자두색, 대조군 = 황토,
 *          샷(실제 장비 흉내) = 단풍 장밋빛 으로 고정해 어디서나 같음.
 * 배치 원칙 : 왼쪽 메뉴 + 오른쪽 한 화면(스크롤 없이)으로 구성함.
 * ===================================================================== */
:root {                                       /* 색, 크기 변수를 한곳에 모음 */
  --paper: #fbf7f0;                           /* 종이색 바탕 */
  --cream: #f3ebdd;                           /* 크림색 카드 바탕 */
  --sand: #e8d7bd;                            /* 모래색 선, 칸 */
  --ink: #2e2420;                             /* 기본 글자색(짙은 밤색) */
  --sub: #6d5e55;                             /* 보조 글자색 */
  --maple: #a9482a;                           /* 단풍 녹슨빛(강조) */
  --ochre: #c38a2b;                           /* 황토색(대조군) */
  --plum: #6e4c82;                            /* 자두색(양자 특징 AI) */
  --lav: #e6def2;                             /* 라벤더 파스텔 바탕 */
  --dusk: #4d6b8c;                            /* 안개 청색(일반 AI) */
  --sky: #dfe8f1;                             /* 하늘 파스텔 바탕 */
  --rose: #c76b67;                            /* 장밋빛(샷 모드, 경고) */
  --blush: #f6e1dc;                           /* 장밋빛 파스텔 바탕 */
  --bark: #3b2c25;                            /* 나무껍질색(메뉴 바탕) */
  --r: 10px;                                  /* 모서리 둥글기 */
  font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; /* 한글 글꼴 우선순위 */
  color: var(--ink); background: var(--paper); /* 기본 글자색과 바탕색 */
  font-size: 14px; line-height: 1.55;         /* 한 화면에 들어가도록 조금 작은 글자 */
}
* { box-sizing: border-box; }                 /* 테두리를 포함해 크기를 계산함 */
html, body { margin: 0; height: 100%; overflow: hidden; } /* 바깥 스크롤을 없앰 */
button, select, input { font: inherit; }      /* 입력 요소도 같은 글꼴을 씀 */
button { cursor: pointer; border: 1px solid var(--sand); background: #fff; color: var(--ink); border-radius: 8px; padding: 6px 12px; } /* 기본 버튼 모양 */
button:hover { border-color: var(--maple); }  /* 마우스를 올리면 테두리 강조 */
button:disabled { opacity: .45; cursor: default; } /* 누를 수 없는 버튼은 흐리게 */
button.primary { background: var(--maple); color: #fff; border-color: var(--maple); } /* 주요 버튼은 단풍색 */
button.ghost { background: transparent; }     /* 보조 버튼은 투명 */
button.on, button[aria-pressed="true"] { background: var(--plum); color: #fff; border-color: var(--plum); } /* 선택된 버튼은 자두색 */
select, input[type=number], input[type=text] { border: 1px solid var(--sand); border-radius: 7px; padding: 5px 8px; background: #fff; } /* 입력칸 모양 */
input[type=range] { accent-color: var(--maple); width: 100%; } /* 슬라이더 색 */
:focus-visible { outline: 3px solid var(--lav); outline-offset: 2px; } /* 키보드 초점 표시 */
h1, h2, h3, h4, p { margin: 0; }              /* 기본 여백 제거 */
.small { font-size: 12px; color: var(--sub); } /* 작은 설명 글씨 */
.eyebrow { font-size: 11px; letter-spacing: .08em; color: var(--maple); font-weight: 800; } /* 작은 머리말 */

/* ---------- 전체 배치 ---------- */
.app { display: grid; grid-template-columns: 236px 1fr; height: 100vh; } /* 왼쪽 메뉴 236px + 오른쪽 나머지 */
.side { background: var(--bark); color: #f4e9da; display: flex; flex-direction: column; padding: 16px 12px; overflow-y: auto; } /* 메뉴 영역 */
.brand { display: flex; gap: 10px; align-items: center; margin: 0 4px 14px; } /* 로고 줄 */
.brand b { display: block; font-size: 15px; } .brand small { color: #e7b98f; } /* 이름과 버전 글씨 */
.logo { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; background: linear-gradient(135deg, var(--maple), var(--plum)); color: #fff; } /* 원형 로고 */
nav h4 { font-size: 11px; color: #c9a98a; letter-spacing: .1em; margin: 12px 8px 4px; } /* 메뉴 그룹 이름 */
nav a { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 8px; color: #f4e9da; text-decoration: none; font-size: 13.5px; } /* 메뉴 항목 */
nav a i { width: 8px; height: 8px; border-radius: 50%; flex: none; } /* 항목 앞 색 점 */
nav a:hover { background: rgba(255,255,255,.07); } /* 마우스를 올리면 밝게 */
nav a.cur { background: #f4e9da; color: var(--bark); font-weight: 700; } /* 현재 화면 항목 */
.side-foot { margin-top: auto; padding: 10px 6px 0; border-top: 1px solid rgba(255,255,255,.12); display: grid; gap: 6px; } /* 메뉴 아래 설정 */
.side-foot small { color: #bda58c; } .tog { font-size: 12px; display: flex; gap: 6px; align-items: center; } /* 설정 글씨 */
.main { display: grid; grid-template-rows: 62px 1fr 52px; min-width: 0; height: 100vh; } /* 제목 줄 + 내용 + 음성 막대 */
.top { display: flex; justify-content: space-between; align-items: center; padding: 0 22px; border-bottom: 1px solid var(--sand); background: #fffdf9; } /* 제목 줄 */
.top h1 { font-size: 21px; letter-spacing: -.03em; } .top-btn { display: flex; gap: 8px; } /* 제목 글씨와 버튼 */
.view { padding: 14px 22px; overflow: auto; min-height: 0; } /* 내용 영역(작은 화면에서만 스크롤) */
.voicebar { display: flex; align-items: center; gap: 8px; padding: 0 16px; background: var(--cream); border-top: 1px solid var(--sand); } /* 음성 막대 */
.voicebar button { padding: 4px 10px; } .voicebar select { max-width: 210px; } /* 음성 막대 버튼 크기 */
.sub { flex: 1; font-size: 13.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 8px; border-left: 3px solid var(--plum); } /* 자막 줄 */
.voicebar.playing .sub { background: var(--lav); border-radius: 4px; padding: 3px 10px; } /* 읽는 중에는 자막을 강조 */

/* ---------- 공통 부품 ---------- */
.card { background: #fff; border: 1px solid var(--sand); border-radius: var(--r); padding: 12px 14px; min-height: 0; } /* 흰 카드 */
.card h3 { font-size: 14.5px; margin-bottom: 6px; } /* 카드 제목 */
.tint-dusk { background: var(--sky); border-color: #c5d4e3; } .tint-plum { background: var(--lav); border-color: #d6c9e8; } /* 색 카드 */
.tint-ochre { background: #f5e8cc; border-color: #ead4a6; } .tint-rose { background: var(--blush); border-color: #ecc7c0; } /* 색 카드 */
.grid { display: grid; gap: 12px; height: 100%; min-height: 0; } /* 기본 격자 */
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } /* 가로 줄 */
.stack { display: grid; gap: 8px; align-content: start; } /* 세로 쌓기 */
.kpi { font-size: 26px; font-weight: 800; letter-spacing: -.03em; } /* 큰 숫자 */
.c-dusk { color: var(--dusk); } .c-plum { color: var(--plum); } .c-ochre { color: var(--ochre); } .c-rose { color: var(--rose); } .c-maple { color: var(--maple); } /* 방식별 글자색 */
.pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 700; } /* 둥근 표시 */
.pill.dusk { background: var(--sky); color: var(--dusk); } .pill.plum { background: var(--lav); color: var(--plum); } .pill.rose { background: var(--blush); color: var(--rose); } .pill.ochre { background: #f5e8cc; color: #8a6118; } /* 표시 색 */
.bar { height: 12px; border-radius: 6px; background: var(--cream); position: relative; overflow: visible; } /* 점수 막대 바탕 */
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; } /* 점수 막대 채움 */
.bar b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); } /* 경보 기준선 */
.banner { background: var(--blush); border: 1px solid #e5b3ab; color: #7d2c22; border-radius: 8px; padding: 7px 12px; font-weight: 700; } /* 안전 규칙 알림 */
table { border-collapse: collapse; width: 100%; font-size: 13px; } th, td { padding: 6px 8px; border-bottom: 1px solid var(--sand); text-align: left; } th { color: var(--sub); font-weight: 700; } /* 표 */
canvas { width: 100%; display: block; border-radius: 8px; } /* 그림 영역 */
.legend { display: flex; gap: 10px; font-size: 12px; color: var(--sub); flex-wrap: wrap; } .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; background: var(--c); vertical-align: -1px; } /* 범례 */
.btns { display: flex; gap: 6px; flex-wrap: wrap; } /* 버튼 묶음 */
.slider { display: grid; grid-template-columns: 1fr 120px 34px; gap: 6px; align-items: center; font-size: 12.5px; } /* 이름 + 슬라이더 + 숫자 */
.slider output { text-align: right; font-variant-numeric: tabular-nums; color: var(--sub); } /* 슬라이더 숫자 */
.mono { font-family: Consolas, "D2Coding", monospace; font-size: 12.5px; } /* 코드 글씨 */
pre.mono { background: #2f2622; color: #f3e6d4; padding: 10px 12px; border-radius: 8px; margin: 0; overflow: auto; white-space: pre; line-height: 1.45; } /* 코드 상자 */
.photo { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; } /* 작은 사진 */
.qa b { color: var(--plum); } /* 질문 강조 */
.arrow { color: var(--maple); font-weight: 900; } /* 화살표 */

/* ---------- 화면별 배치 ---------- */
.v-home { grid-template-columns: 1.25fr 1fr; grid-template-rows: auto 1fr; } /* 처음 화면 */
.v-home .hero { grid-column: 1 / -1; display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; align-items: center; } /* 소개 줄 */
.v-home .hero h2 { font-size: 30px; letter-spacing: -.05em; line-height: 1.2; } .v-home .hero img { width: 100%; height: 210px; object-fit: cover; border-radius: 12px; } /* 큰 제목과 사진 */
.cards4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; grid-column: 1 / -1; } /* 카드 4장 */
.kid { grid-template-columns: 1.05fr 1fr; grid-template-rows: 1fr auto; } /* 동전 놀이 화면 */
.kid .pic { display: grid; place-items: center; background: var(--cream); border-radius: 14px; } /* 그림 칸 */
.kid .txt h2 { font-size: 24px; margin-bottom: 10px; letter-spacing: -.04em; } .kid .txt p { font-size: 16px; line-height: 1.8; margin-bottom: 10px; } /* 큰 글씨 설명 */
.dots { display: flex; gap: 6px; } .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--sand); } .dots i.on { background: var(--maple); } /* 쪽 표시 점 */
.v3 { grid-template-columns: 270px 1fr 1fr; } /* 3단 배치 */
.v-sim { grid-template-columns: 250px 1fr 300px; } /* 시뮬레이션 3단 */
.v-cmp { grid-template-columns: 1fr 1fr 290px; grid-template-rows: auto 1fr; } /* 비교 화면 */
.steps4 { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; } /* 4단계 설명 줄 */
.steps4 .card { padding: 9px 12px; } .steps4 .card p { font-size: 12.8px; } /* 4단계 카드 */
.sig-group h4 { font-size: 11.5px; color: var(--maple); margin: 6px 0 2px; } /* 신호 그룹 이름 */
.sig { display: grid; grid-template-columns: 96px 1fr 28px; gap: 4px; align-items: center; font-size: 11.8px; height: 21px; } /* 촘촘한 신호 슬라이더 */
.sig.rule span { color: var(--rose); } /* 규칙 신호는 장밋빛 */
.stepbtns { display: grid; gap: 4px; } .stepbtns button { text-align: left; padding: 5px 9px; font-size: 12.5px; } /* 단계 버튼 */
.stepbtns button.cur { background: var(--lav); border-color: var(--plum); font-weight: 700; } /* 현재 단계 */
.gloss { grid-template-columns: 1fr 1fr; grid-auto-rows: min-content; } .gloss .card { cursor: pointer; padding: 7px 12px; font-size: 13px; } /* 용어 사전 */
.tree { white-space: pre; } /* 폴더 구조 */
@media (max-width: 1100px) { .app { grid-template-columns: 190px 1fr; } .v-sim, .v-cmp, .v3 { grid-template-columns: 1fr 1fr; } .cards4 { grid-template-columns: 1fr 1fr; } } /* 작은 화면에서는 2단으로 */

</style>                   <!-- 색감과 배치를 정한 스타일 파일임 -->
</head>
<body>
<div class="app">                                               <!-- 전체 화면을 감싸는 틀임 -->
  <aside class="side">                                          <!-- 왼쪽 메뉴 영역임 -->
    <div class="brand"><span class="logo">Q</span><div><b>산행안전 양자 실험실</b><small id="ver">v02</small></div></div> <!-- 프로그램 이름과 버전임 -->
    <nav id="menu"></nav>                                       <!-- 메뉴 항목은 app.js가 채움 -->
    <div class="side-foot">                                     <!-- 메뉴 아래 설정 영역임 -->
      <label class="tog"><input type="checkbox" id="autoVoice"> 화면을 열면 짧은 안내 읽기</label> <!-- 화면 이동 시 자동 안내 여부임 -->
      <small>가상, 합성 데이터로 동작하는 연구 데모</small>    <!-- 데이터 성격을 밝힘 -->
    </div>
  </aside>
  <main class="main">                                           <!-- 오른쪽 내용 영역임 -->
    <header class="top">                                        <!-- 화면 제목 줄임 -->
      <div><p class="eyebrow" id="viewGroup"></p><h1 id="viewTitle"></h1></div> <!-- 메뉴 그룹과 화면 제목임 -->
      <div class="top-btn">                                     <!-- 오른쪽 위 음성 버튼들임 -->
        <button id="btnShort" class="ghost">짧은 안내 듣기</button> <!-- 짧은 안내를 읽음 -->
        <button id="btnLong" class="primary">자세한 설명 듣기</button> <!-- 긴 설명을 읽음 -->
      </div>
    </header>
    <section id="view" class="view"></section>                  <!-- 선택한 화면 내용이 들어가는 자리임 -->
    <footer class="voicebar">                                   <!-- 아래 음성 막대임 -->
      <button id="vPlay" title="이 화면 설명 재생">▶</button>   <!-- 재생 버튼임 -->
      <button id="vPause" title="일시정지">❚❚</button>          <!-- 일시정지 버튼임 -->
      <button id="vStop" title="정지">■</button>                <!-- 정지 버튼임 -->
      <select id="vRate" title="말하기 속도"><option value="0.8">느리게</option><option value="1" selected>보통</option><option value="1.2">조금 빠르게</option></select> <!-- 속도 선택임 -->
      <select id="vVoice" title="목소리"></select>              <!-- 한국어 목소리 선택임 -->
      <div id="sub" class="sub" aria-live="polite">▶를 누르면 이 화면을 목소리와 자막으로 설명해 드려요.</div> <!-- 자막 줄임 -->
    </footer>
  </main>

<script>
/* =====================================================================
 * emulator.js : 양자 회로 상태벡터 에뮬레이터 (브라우저용)
 * ---------------------------------------------------------------------
 * 왜 쓰는가 : 실제 양자컴퓨터 없이, 일반 PC 메모리에서 큐비트의 상태를
 *            숫자 목록(상태벡터)으로 저장하고 게이트를 행렬 계산으로
 *            흉내 내기 위함임.
 * 하는 일   : n개 큐비트의 2^n개 복소 진폭을 저장하고, RY, RX, RZ, H,
 *            X, CNOT, CZ 게이트를 적용하고, 확률을 읽거나(정확 판독)
 *            실제 장비처럼 여러 번 측정(샷)해서 결과를 셈.
 * 주의      : 일반 컴퓨터로 계산하므로 "양자 속도 이점"은 없음.
 *            큐비트가 1개 늘 때마다 메모리가 2배로 늘어남.
 * ===================================================================== */
(function (QP) {                                   // 전역 이름공간 QP 안에 기능을 넣기 위한 즉시 실행 함수임
  "use strict";                                     // 실수(선언 안 한 변수 등)를 오류로 잡아 주는 엄격 모드를 켬

  /* ---------- 1. 상태벡터 만들기 ---------- */
  function createState(n) {                         // n큐비트 상태벡터를 새로 만드는 함수임
    const size = 1 << n;                            // 가능한 결과의 수 2^n을 비트 이동으로 계산함
    const re = new Float64Array(size);              // 각 결과 진폭의 실수부를 저장할 배열임
    const im = new Float64Array(size);              // 각 결과 진폭의 허수부를 저장할 배열임
    re[0] = 1;                                      // 처음에는 모든 큐비트가 0인 |00..0> 상태에서 시작함
    return { n: n, size: size, re: re, im: im };    // 큐비트 수, 크기, 진폭 배열을 하나로 묶어 돌려줌
  }

  /* ---------- 2. 한 큐비트 게이트 공통 처리 ---------- */
  // 2x2 복소 행렬 [[a,b],[c,d]]를 큐비트 q에 적용하는 공통 함수임
  function apply1(s, q, ar, ai, br, bi, cr, ci, dr, di) {
    const bit = 1 << q;                             // q번 큐비트를 가리키는 비트 마스크를 만듦
    for (let i = 0; i < s.size; i++) {              // 모든 진폭 위치를 하나씩 살펴봄
      if (i & bit) continue;                        // q비트가 1인 위치는 짝(0인 위치)에서 함께 처리하므로 건너뜀
      const j = i | bit;                            // q비트만 1로 바꾼 짝 위치를 구함
      const xr = s.re[i], xi = s.im[i];             // q비트가 0인 쪽의 진폭(실수, 허수)을 꺼냄
      const yr = s.re[j], yi = s.im[j];             // q비트가 1인 쪽의 진폭(실수, 허수)을 꺼냄
      s.re[i] = ar * xr - ai * xi + br * yr - bi * yi; // 새 진폭(0쪽) 실수부 = a*x + b*y 의 실수부임
      s.im[i] = ar * xi + ai * xr + br * yi + bi * yr; // 새 진폭(0쪽) 허수부 = a*x + b*y 의 허수부임
      s.re[j] = cr * xr - ci * xi + dr * yr - di * yi; // 새 진폭(1쪽) 실수부 = c*x + d*y 의 실수부임
      s.im[j] = cr * xi + ci * xr + dr * yi + di * yr; // 새 진폭(1쪽) 허수부 = c*x + d*y 의 허수부임
    }
    return s;                                       // 연속 호출이 가능하도록 상태를 돌려줌
  }

  /* ---------- 3. 자주 쓰는 게이트 ---------- */
  function ry(s, q, angle) {                        // RY: y축 회전, 입력값을 확률로 바꾸는 데 씀
    const c = Math.cos(angle / 2), sn = Math.sin(angle / 2); // 회전 행렬의 코사인, 사인 성분임
    return apply1(s, q, c, 0, -sn, 0, sn, 0, c, 0); // [[c,-s],[s,c]] 행렬을 적용함
  }
  function rx(s, q, angle) {                        // RX: x축 회전 게이트임
    const c = Math.cos(angle / 2), sn = Math.sin(angle / 2); // 회전 성분을 구함
    return apply1(s, q, c, 0, 0, -sn, 0, -sn, c, 0); // [[c,-i s],[-i s,c]] 행렬을 적용함
  }
  function rz(s, q, angle) {                        // RZ: z축 회전(위상만 바꿈) 게이트임
    const c = Math.cos(angle / 2), sn = Math.sin(angle / 2); // e^{±iθ/2}의 성분을 구함
    return apply1(s, q, c, -sn, 0, 0, 0, 0, c, sn); // [[e^{-iθ/2},0],[0,e^{iθ/2}]] 행렬을 적용함
  }
  function h(s, q) {                                // H(하다마드): 0과 1을 반반 섞는 게이트임
    const r = Math.SQRT1_2;                         // 1/√2 값을 미리 구함
    return apply1(s, q, r, 0, r, 0, r, 0, -r, 0);   // [[1,1],[1,-1]]/√2 행렬을 적용함
  }
  function x(s, q) {                                // X(NOT): 0과 1을 맞바꾸는 게이트임
    return apply1(s, q, 0, 0, 1, 0, 1, 0, 0, 0);    // [[0,1],[1,0]] 행렬을 적용함
  }

  /* ---------- 4. 두 큐비트 게이트 ---------- */
  function cx(s, control, target) {                 // CNOT: 제어 큐비트가 1일 때만 대상 큐비트를 뒤집음
    const cb = 1 << control, tb = 1 << target;      // 제어, 대상 큐비트의 비트 마스크임
    for (let i = 0; i < s.size; i++) {              // 모든 진폭 위치를 살펴봄
      if ((i & cb) && !(i & tb)) {                  // 제어=1이고 대상=0인 위치만 골라 짝과 교환함
        const j = i | tb;                           // 대상 비트를 1로 바꾼 짝 위치임
        let t = s.re[i]; s.re[i] = s.re[j]; s.re[j] = t; // 실수부를 맞바꿈
        t = s.im[i]; s.im[i] = s.im[j]; s.im[j] = t;     // 허수부를 맞바꿈
      }
    }
    return s;                                       // 상태를 돌려줌
  }
  function cz(s, a, b) {                            // CZ: 두 큐비트가 모두 1일 때 부호(위상)를 뒤집음
    const m = (1 << a) | (1 << b);                  // 두 큐비트를 함께 가리키는 마스크임
    for (let i = 0; i < s.size; i++) {              // 모든 위치를 살펴봄
      if ((i & m) === m) { s.re[i] = -s.re[i]; s.im[i] = -s.im[i]; } // 둘 다 1이면 진폭에 -1을 곱함
    }
    return s;                                       // 상태를 돌려줌
  }

  /* ---------- 5. 판독(측정) ---------- */
  function probs(s) {                               // 각 결과가 나올 정확한 확률 목록을 계산함
    const p = new Float64Array(s.size);             // 확률을 담을 배열임
    for (let i = 0; i < s.size; i++) p[i] = s.re[i] * s.re[i] + s.im[i] * s.im[i]; // |진폭|^2 = 확률임
    return p;                                       // 확률 배열을 돌려줌
  }
  function probOne(s, q) {                          // q번 큐비트가 1로 읽힐 확률을 계산함
    const bit = 1 << q; let sum = 0;                // 마스크와 누적 합을 준비함
    for (let i = 0; i < s.size; i++) if (i & bit) sum += s.re[i] * s.re[i] + s.im[i] * s.im[i]; // q비트가 1인 결과의 확률을 모두 더함
    return sum;                                     // 합계가 곧 P(q=1)임
  }
  function expectZ(s, q) {                          // Z 기댓값 = P(0) - P(1), -1~+1 사이 숫자임
    return 1 - 2 * probOne(s, q);                   // P(0)=1-P(1) 이므로 1-2P(1)로 계산함
  }
  function norm(s) {                                // 확률의 총합(항상 1이어야 함)을 검사용으로 계산함
    let t = 0;                                      // 누적 변수임
    for (let i = 0; i < s.size; i++) t += s.re[i] * s.re[i] + s.im[i] * s.im[i]; // 모든 확률을 더함
    return t;                                       // 1에 가까우면 계산이 올바른 것임
  }

  /* ---------- 6. 샷(실제 장비처럼 여러 번 측정) ---------- */
  function rng(seed) {                              // 같은 씨앗이면 같은 난수열을 내는 간단한 난수 생성기임
    let x = seed >>> 0;                             // 32비트 부호 없는 정수로 시작값을 맞춤
    return function () {                            // 호출할 때마다 0~1 난수를 하나씩 돌려주는 함수임
      x = (Math.imul(x, 1664525) + 1013904223) >>> 0; // 선형 합동 방식으로 다음 정수를 만듦
      return x / 4294967296;                        // 0 이상 1 미만의 실수로 바꿈
    };
  }
  // 정확한 확률 p를 shots번 측정했을 때 얻는 "추정 확률"을 흉내 냄
  function sampleProb(p, shots, rand) {
    if (!shots) return p;                           // 샷 0(무한대)이면 정확한 확률을 그대로 씀
    if (shots > 200) {                              // 샷이 많으면 정규분포 근사로 빠르게 계산함
      const sd = Math.sqrt(p * (1 - p) / shots);    // 이항분포 비율의 표준편차임
      const u1 = Math.max(rand(), 1e-12), u2 = rand(); // 박스-뮬러 변환에 쓸 난수 두 개임
      const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2); // 표준정규 난수를 만듦
      return Math.min(1, Math.max(0, p + sd * z));  // 0~1 범위로 자른 추정 확률을 돌려줌
    }
    let k = 0;                                      // 1이 나온 횟수를 셀 변수임
    for (let t = 0; t < shots; t++) if (rand() < p) k++; // 동전을 shots번 던지듯 직접 셈
    return k / shots;                               // 횟수 비율이 추정 확률임
  }
  function sampleCounts(s, shots, rand) {           // 전체 결과(00,01,...)별 측정 횟수를 셈
    const p = probs(s);                             // 정확한 확률 목록을 먼저 구함
    const counts = new Array(s.size).fill(0);       // 결과별 횟수를 0으로 초기화함
    for (let t = 0; t < shots; t++) {               // shots번 반복해서 측정함
      let r = rand(), i = 0;                        // 0~1 난수 하나와 위치 변수임
      while (i < s.size - 1 && r >= p[i]) { r -= p[i]; i++; } // 누적 확률 구간에 따라 결과 하나를 고름
      counts[i]++;                                  // 고른 결과의 횟수를 1 늘림
    }
    return counts;                                  // 결과별 횟수를 돌려줌
  }

  /* ---------- 7. 비트 문자열 표시 ---------- */
  function label(i, n) {                            // 위치 번호 i를 "q0q1.." 순서 비트 문자열로 바꿈
    let t = "";                                     // 결과 문자열임
    for (let q = 0; q < n; q++) t += (i >> q) & 1;  // q0부터 차례로 비트를 붙임(화면 읽기 순서)
    return t;                                       // 예: n=2, i=1 → "10"(q0=1, q1=0)
  }

  /* ---------- 8. 메모리 계산 ---------- */
  function memoryBytes(n) {                         // n큐비트 상태벡터 저장에 필요한 바이트 수임
    return Math.pow(2, n) * 16;                     // 복소수 1개 = 실수 8바이트 + 허수 8바이트 = 16바이트임
  }

  // 위 기능을 QP.Sim 아래에 모아 다른 파일에서 쓰도록 공개함
  QP.Sim = { createState, apply1, ry, rx, rz, h, x, cx, cz, probs, probOne, expectZ, norm,
             rng, sampleProb, sampleCounts, label, memoryBytes };
})(window.QP = window.QP || {});                    // QP 이름공간이 없으면 새로 만들어 넘김

  function policy(x) {                              // 점수와 상관없이 바로 처리해야 하는 상황을 판정함

  }
  function sampleSet(seed, count, opts) {           // 씨앗 고정 합성 표본을 count개 만듦

    const lines = text.trim().split(/\r?\n/);       // 줄 단위로 자름(윈도우 줄바꿈도 처리)
    const head = lines[0].split(",").map(function (h) { return h.trim(); }); // 열 이름 목록임
    const idx = signals.map(function (s) { return head.indexOf(s[2]); }); // 신호별로 CSV의 몇 번째 열인지 찾음
    const li = head.indexOf("label");               // 정답 열 위치를 찾음(없으면 -1)
    const missing = signals.filter(function (_, i) { return idx[i] < 0; }).map(function (s) { return s[2]; }); // 없는 열 이름 목록임
    const rows = [];                                // 결과 목록임
    for (let k = 1; k < lines.length; k++) {        // 둘째 줄부터 자료를 읽음
      const c = lines[k].split(",");                // 쉼표로 칸을 나눔
      const x = idx.map(function (j) {              // 신호 20개를 순서대로 채움
        const v = j < 0 ? 0 : parseFloat(c[j]);     // 열이 없으면 0, 있으면 숫자로 바꿈
        return isFinite(v) ? Math.min(1, Math.max(0, v)) : 0; // 0~1 밖의 값과 빈칸을 정리함
      });
      const y = li >= 0 ? (Number(c[li]) ? 1 : 0) : (syntheticLabel(x) ? 1 : 0); // 정답이 없으면 합성 규칙으로 붙임
      rows.push({ x: x, label: y });                // 한 줄을 표본으로 저장함
    }
    return { rows: rows, missing: missing, hasLabel: li >= 0 }; // 표본과 함께 누락 정보를 돌려줌
  }

  // 위 기능을 QP.Data로 공개함
  QP.Data = { signals, exclusions, pairs, routes, policy, vector, syntheticLabel, sampleSet, toCSV, fromCSV };
})(window.QP = window.QP || {});                    // QP 이름공간을 넘김

</script>                               <!-- 신호, 시나리오, 합성 데이터임 -->
<script>
/* =====================================================================
 * models.js : 특징 만들기, AI 학습(로지스틱 회귀), 성능 시험, VQC
 * ---------------------------------------------------------------------
 * 왜 쓰는가 : "양자 회로를 쓴 AI"와 "일반 AI"를 같은 데이터, 같은
 *            학습 방법, 같은 오경보 예산으로 공정하게 비교하기 위함임.
 * 하는 일   :
 *  (1) 특징 변환 : 일반(원래 값) / 양자 회로(정확 판독) / 양자 회로
 *      (샷 측정, 실제 장비 흉내) / 일반 수식 대조군(cos 곱)
 *  (2) 학습     : 세 방식 모두 같은 로지스틱 회귀 가중치를 학습함
 *      → 회로는 "고정된 특징 변환기", 학습은 AI 분류기가 담당함
 *  (3) VQC     : 회로의 회전 각도 자체를 학습하는 "변분 양자 회로"
 *      → 양자 회로도 학습할 수 있다는 것을 보여 주는 실험임
 * ===================================================================== */
(function (QP) {                                    // QP 이름공간에 모델 기능을 붙임
  "use strict";                                     // 엄격 모드를 켬
  const S = QP.Sim, D = QP.Data;                    // 에뮬레이터와 데이터 모듈을 짧은 이름으로 씀

  /* ---------- 1. 2큐비트 "겹침 감지" 회로 ---------- */
  // 두 신호 a, b(0~1)를 받아 RY 회전 → CNOT → 둘째 큐비트 판독을 수행함
  function pairCircuit(a, b) {
    const s = S.createState(2);                     // 2큐비트(진폭 4개) 상태를 |00>으로 만듦
    S.ry(s, 0, Math.PI * a);                        // 첫 신호를 첫 큐비트의 회전 각도로 넣음(값이 클수록 1에 가까워짐)
    S.ry(s, 1, Math.PI * b);                        // 둘째 신호를 둘째 큐비트의 회전 각도로 넣음
    S.cx(s, 0, 1);                                  // 첫 큐비트가 1이면 둘째 큐비트를 뒤집어 두 신호를 "얽음"
    return s;                                       // 판독 전 상태를 돌려줌
  }
  function pairExact(a, b) {                        // 샷 없이 정확히 읽은 결합 특징 <Z1>임
    return S.expectZ(pairCircuit(a, b), 1);         // 둘째 큐비트의 P(0)-P(1)을 특징값으로 씀
  }
  function pairAnalytic(a, b) {                     // 같은 값을 일반 수식으로 계산한 대조군임
    return Math.cos(Math.PI * a) * Math.cos(Math.PI * b); // 이 작은 회로는 cos 곱과 수학적으로 같음
  }

  /* ---------- 2. 방식별 특징 만들기 ---------- */
  // method: "linear" | "quantum" | "analytic" | "shots"
  function features(x, method, ctx) {
    const base = x.filter(function (_, i) { return !D.exclusions.has(i); }); // 즉시 규칙 신호 4개를 뺀 16개를 기본 입력으로 씀
    if (method === "linear") return base;           // 일반 AI는 원래 값 16개만 받음
    const extra = D.pairs.map(function (p) {        // 6개 신호 쌍마다 결합 특징을 하나씩 만듦
      const a = x[p[0]], b = x[p[1]];               // 쌍의 두 신호 값을 꺼냄
      if (method === "analytic") return pairAnalytic(a, b); // 대조군은 수식으로 계산함
      const z = pairExact(a, b);                    // 양자 회로를 에뮬레이터로 실행함
      if (method === "shots" && ctx && ctx.shots) { // 샷 모드면 실제 장비처럼 유한 번 측정함
        const p1 = (1 - z) / 2;                     // <Z>를 P(1)로 되돌림
        let est = S.sampleProb(p1, ctx.shots, ctx.rand); // shots번 측정한 추정 확률을 얻음
        if (ctx.noise) est = est * (1 - ctx.noise) + ctx.noise * 0.5; // 장비 잡음(탈분극)이 있으면 0.5쪽으로 흐려짐
        return 1 - 2 * est;                         // 다시 <Z> 형태로 바꿔 특징값으로 씀
      }
      return z;                                     // 정확 판독값을 그대로 씀
    });
    return base.concat(extra);                      // 원래 16개 + 결합 6개 = 22개 특징을 돌려줌
  }

  /* ---------- 3. 로지스틱 회귀 (모든 방식이 공통으로 쓰는 AI) ---------- */
  const sigmoid = function (z) { return 1 / (1 + Math.exp(-z)); }; // 아무 숫자를 0~1 확률로 바꾸는 함수임
  function scoreW(w, f) {                           // 가중치 w와 특징 f로 위험 점수를 계산함
    let z = w[0];                                   // 절편(기본값)에서 시작함
    for (let i = 0; i < f.length; i++) z += w[i + 1] * f[i]; // 특징마다 가중치를 곱해 더함
    return sigmoid(z);                              // 0~1 위험 점수로 바꿔 돌려줌
  }
  function fitRows(rows, epochs, lr, l2) {          // 특징 행렬로 가중치를 학습함(경사하강법)
    const w = new Array(rows[0].f.length + 1).fill(0); // 모든 가중치를 0에서 시작함(공정 비교)
    const loss = [];                                // 학습 곡선을 기록할 배열임
    for (let e = 0; e < epochs; e++) {              // 정해진 횟수만큼 반복 학습함
      const g = new Array(w.length).fill(0); let L = 0; // 기울기 누적과 손실 누적을 준비함
      for (let r = 0; r < rows.length; r++) {       // 모든 학습 표본을 봄
        const p = scoreW(w, rows[r].f), y = rows[r].label; // 현재 예측과 정답임
        const err = p - y;                          // 예측 오차(교차엔트로피의 미분)임
        L -= y ? Math.log(p + 1e-12) : Math.log(1 - p + 1e-12); // 손실을 누적함
        g[0] += err;                                // 절편의 기울기를 더함
        for (let i = 0; i < rows[r].f.length; i++) g[i + 1] += err * rows[r].f[i]; // 특징별 기울기를 더함
      }
      for (let i = 0; i < w.length; i++) w[i] -= lr * (g[i] / rows.length + (i ? l2 * w[i] : 0)); // 오차가 줄어드는 쪽으로 가중치를 고침
      loss.push(L / rows.length);                   // 평균 손실을 기록함
    }
    return { w: w, loss: loss };                    // 학습된 가중치와 학습 곡선을 돌려줌
  }
  function fit(samples, method, ctx) {              // 원시 표본으로 방식별 모델을 학습함
    const rows = samples.map(function (s) { return { f: features(s.x, method, ctx), label: s.label }; }); // 특징을 미리 계산함
    const r = fitRows(rows, 160, .65, .004);        // 세 방식에 같은 학습 횟수, 학습률, 규제를 씀
    const predict = function (x, c) { return scoreW(r.w, features(x, method, c || ctx)); }; // 새 입력의 점수를 내는 함수임
    return { predict: predict, w: r.w, loss: r.loss }; // 예측 함수, 가중치, 학습 곡선을 돌려줌
  }

  /* ---------- 4. 공정한 경보 기준과 성적 ---------- */
  function cutoff(valid, predict) {                 // 검증 정상 표본의 약 10%만 경보가 나도록 기준을 정함
    const neg = valid.filter(function (r) { return !r.label; }).map(function (r) { return predict(r.x); }).sort(function (a, b) { return a - b; }); // 정상 점수를 정렬함
    return neg[Math.ceil(neg.length * .90) - 1] + 1e-9; // 상위 10% 경계값을 기준으로 씀(같은 오경보 예산)
  }
  function auc(scores, labels) {                    // ROC-AUC: 위험을 정상보다 높게 점수 매긴 비율임
    const pos = [], neg = [];                       // 위험, 정상 점수를 나눠 담음
    scores.forEach(function (s, i) { (labels[i] ? pos : neg).push(s); }); // 정답에 따라 분류함
    let win = 0;                                    // 위험 점수가 더 높은 쌍의 수임
    const sn = neg.slice().sort(function (a, b) { return a - b; }); // 정상 점수를 정렬해 빠르게 셈
    pos.forEach(function (p) {                      // 위험 표본 하나씩 봄
      let lo = 0, hi = sn.length;                   // 이분 탐색 범위임
      while (lo < hi) { const m = (lo + hi) >> 1; if (sn[m] < p) lo = m + 1; else hi = m; } // p보다 작은 정상 점수 개수를 찾음
      win += lo;                                    // 그만큼 이긴 것으로 셈
    });
    return win / (pos.length * neg.length || 1);    // 전체 쌍 중 이긴 비율임(0.5=무작위, 1=완벽)
  }
  function measure(test, predict, thr) {            // 시험 표본으로 탐지율, 오경보율, AUC를 셈
    const sc = test.map(function (r) { return predict(r.x); }); // 모든 시험 점수를 계산함
    let tp = 0, P = 0, fp = 0, N = 0;               // 맞힌 위험, 전체 위험, 잘못 울린 정상, 전체 정상 수임
    test.forEach(function (r, i) { if (r.label) { P++; if (sc[i] >= thr) tp++; } else { N++; if (sc[i] >= thr) fp++; } }); // 하나씩 집계함
    return { recall: tp / (P || 1), falseAlarm: fp / (N || 1), auc: auc(sc, test.map(function (r) { return r.label; })), P: P, N: N }; // 결과 묶음임
  }

  /* ---------- 5. 전체 비교 실험 ---------- */
  // opts: {data:{train,valid,test}, shots, noise, seed}
  function experiment(opts) {
    const o = opts || {};                           // 옵션 기본값 처리임
    const data = o.data || {                        // 데이터가 없으면 기본 합성 표본을 만듦
      train: D.sampleSet(901, 1400), valid: D.sampleSet(902, 550), test: D.sampleSet(903, 800) }; // 학습, 기준, 시험을 서로 다른 씨앗으로 분리함
    const methods = ["linear", "quantum", "analytic"]; // 기본 세 방식임
    if (o.shots) methods.push("shots");             // 샷 수가 정해지면 "실제 장비 흉내" 방식을 추가함
    return methods.map(function (m) {               // 방식마다 같은 절차를 반복함
      const ctx = m === "shots" ? { shots: o.shots, noise: o.noise || 0, rand: S.rng(o.seed || 7) } : null; // 샷 모드 전용 설정임
      const t0 = performance.now();                 // 학습 시작 시각을 기록함
      const model = fit(data.train, m, ctx);        // 모델을 학습함
      const thr = cutoff(data.valid, model.predict); // 검증 표본으로 경보 기준을 정함
      const res = measure(data.test, model.predict, thr); // 별도의 시험 표본으로 성적을 매김
      const ms = performance.now() - t0;            // 걸린 시간(밀리초)을 계산함
      return Object.assign({ key: m, predict: model.predict, threshold: thr, loss: model.loss, w: model.w, ms: ms }, res); // 결과를 묶어 돌려줌
    });
  }

  /* ---------- 6. 결정 지도 (비 × 경사 2차원) ---------- */
  // 다른 신호는 고정하고, 두 신호만 0~1로 바꿔 가며 점수를 칠해 보는 지도임
  function decisionMap(predict, i, j, base, n) {
    const g = n || 36;                              // 한 변의 칸 수임
    const grid = [];                                // 점수를 담을 2차원 배열임
    for (let r = 0; r < g; r++) {                   // 세로(j 신호) 방향 반복임
      const row = [];                               // 한 줄 점수임
      for (let c = 0; c < g; c++) {                 // 가로(i 신호) 방향 반복임
        const x = base.slice();                     // 기준 입력을 복사함
        x[i] = c / (g - 1); x[j] = 1 - r / (g - 1); // 가로는 i 신호, 세로는 j 신호(위가 높음)로 값을 바꿈
        row.push(predict(x));                       // 그 칸의 점수를 계산해 넣음
      }
      grid.push(row);                               // 한 줄을 지도에 추가함
    }
    return grid;                                    // 완성된 지도를 돌려줌
  }

  /* ---------- 7. VQC: 회로 각도를 직접 학습하는 양자 분류기 ---------- */
  // 입력(a,b) 부호화 → [학습 회전 RY(θ) 두 개 + CNOT] × 층 수 → 둘째 큐비트 <Z> → sigmoid(k·z + c)
  function vqcZ(theta, a, b, layers) {
    const s = S.createState(2);                     // 2큐비트 상태를 만듦
    S.ry(s, 0, Math.PI * a); S.ry(s, 1, Math.PI * b); // 데이터(비, 경사)를 각도로 넣음
    S.cx(s, 0, 1);                                  // 두 신호를 얽음
    for (let l = 0; l < layers; l++) {              // 학습 가능한 층을 차례로 쌓음
      S.ry(s, 0, theta[2 * l]); S.ry(s, 1, theta[2 * l + 1]); // 학습되는 회전 각도 두 개를 적용함
      S.cx(s, 0, 1);                                // 다시 얽어서 두 큐비트 정보를 섞음
      S.ry(s, 0, Math.PI * a * (l + 2) / 2);        // 데이터를 한 번 더 넣는 "재업로딩"으로 표현력을 키움
    }
    return S.expectZ(s, 1);                         // 둘째 큐비트의 기댓값(-1~1)을 출력으로 씀
  }
  function vqcCreate(layers, seed) {                // VQC 학습기 하나를 만듦
    const r = S.rng(seed || 3);                     // 초기 각도를 정할 난수임
    return { layers: layers, theta: Array.from({ length: 2 * layers }, function () { return (r() - .5) * .4; }), k: 1, c: 0, epoch: 0, loss: [] }; // 작은 무작위 각도에서 시작함
  }
  function vqcPredict(m, a, b) {                    // 학습 중인 VQC의 위험 점수임
    return sigmoid(m.k * vqcZ(m.theta, a, b, m.layers) + m.c); // 회로 출력을 0~1 점수로 바꿈
  }
  // 한 번의 학습 단계: 매개변수 이동 규칙(parameter-shift)으로 각도 기울기를 정확히 구함
  function vqcStep(m, data, lr) {
    const gT = new Array(m.theta.length).fill(0); let gk = 0, gc = 0, L = 0; // 각 기울기와 손실 누적임
    data.forEach(function (d) {                     // 학습 표본을 하나씩 봄
      const z = vqcZ(m.theta, d.a, d.b, m.layers);  // 현재 회로 출력임
      const p = sigmoid(m.k * z + m.c);             // 현재 위험 점수임
      const err = p - d.y;                          // 오차임
      L -= d.y ? Math.log(p + 1e-12) : Math.log(1 - p + 1e-12); // 손실을 누적함
      gk += err * z; gc += err;                     // 고전 후처리(k, c)의 기울기임
      for (let t = 0; t < m.theta.length; t++) {    // 각 회전 각도마다
        const plus = m.theta.slice(), minus = m.theta.slice(); // 각도를 ±90도 옮긴 복사본을 만듦
        plus[t] += Math.PI / 2; minus[t] -= Math.PI / 2; // 매개변수 이동 규칙의 두 지점임
        const dz = (vqcZ(plus, d.a, d.b, m.layers) - vqcZ(minus, d.a, d.b, m.layers)) / 2; // 실제 양자 장비에서도 쓰는 정확한 미분 공식임
        gT[t] += err * m.k * dz;                    // 연쇄 법칙으로 손실 기울기를 누적함
      }
    });
    const n = data.length;                          // 표본 수임
    for (let t = 0; t < m.theta.length; t++) m.theta[t] -= lr * gT[t] / n; // 각도를 오차가 줄어드는 쪽으로 돌림
    m.k -= lr * gk / n; m.c -= lr * gc / n;         // 후처리 값도 고침
    m.epoch++; m.loss.push(L / n);                  // 학습 횟수와 손실을 기록함
    return L / n;                                   // 이번 평균 손실을 돌려줌
  }
  function vqcData(seed, n) {                       // VQC용 2차원(비, 경사) 합성 표본을 만듦
    const r = S.rng(seed);                          // 고정 씨앗 난수임
    return Array.from({ length: n }, function () { const a = r(), b = r(); return { a: a, b: b, y: a * b > .42 ? 1 : 0 }; }); // "둘 다 높으면 위험" 규칙임
  }
  function vqcAccuracy(m, data) {                   // 정확도(0.5 기준으로 맞힌 비율)를 계산함
    let ok = 0;                                     // 맞힌 수임
    data.forEach(function (d) { if ((vqcPredict(m, d.a, d.b) >= .5 ? 1 : 0) === d.y) ok++; }); // 하나씩 채점함
    return ok / data.length;                        // 비율을 돌려줌
  }

  /* ---------- 8. 위험구역 4큐비트 회로 (세미나 자료 부록 그대로) ---------- */
  function zoneEncode(dist, quality) {              // 거리(m) 세 개와 위치 신뢰도를 0~1 입력으로 바꿈
    const scales = [120, 180, 100];                 // 위험구역, 야생동물, 낙석의 기준 거리(m)임
    if (quality < .6 || dist.some(function (d) { return d == null; })) return null; // 신뢰도가 낮거나 자료가 없으면 판독을 보류함
    return dist.map(function (d, i) { return Math.max(0, Math.min(1, 1 - d / scales[i])); }).concat([quality]); // 가까울수록 1에 가까운 값임
  }
  function zoneCircuit(x) {                         // 4큐비트(진폭 16개) 회로를 실행함
    const s = S.createState(4);                     // |0000> 상태를 만듦
    for (let q = 0; q < 4; q++) S.ry(s, q, Math.PI * x[q]); // 네 입력을 네 큐비트의 회전 각도로 넣음
    [[0, 3], [1, 3], [2, 3]].forEach(function (p) { S.cx(s, p[0], p[1]); }); // 세 위험 큐비트를 보조 큐비트 q3에 연결함
    for (let q = 0; q < 3; q++) S.ry(s, q, Math.PI * x[3] / 12); // 신뢰도만큼 약간 더 돌려 보정함
    return { state: s, p: [0, 1, 2, 3].map(function (q) { return S.probOne(s, q); }) }; // 상태와 큐비트별 P(1)을 돌려줌
  }
  function zoneAssess(dist, quality, closed) {      // 정책 우선 → 부호화 → 회로 순서로 판단함
    if (closed) return { action: "block_route" };   // 공식 통제면 회로를 돌리지 않고 바로 제외함
    const x = zoneEncode(dist, quality);            // 입력을 부호화함
    if (!x) return { action: "check_sources" };     // 자료가 부족하면 출처 확인을 요청함
    const r = zoneCircuit(x);                       // 회로를 실행함
    return { action: "score_only", classical: x.slice(0, 3), quantum: r.p.slice(0, 3), ancilla: r.p[3], state: r.state, x: x }; // 고전, 양자 값을 함께 돌려줌
  }

  // 위 기능을 QP.Models로 공개함
  QP.Models = { pairCircuit, pairExact, pairAnalytic, features, fit, fitRows, cutoff, measure, auc, experiment, decisionMap,
                vqcCreate, vqcPredict, vqcStep, vqcData, vqcAccuracy, vqcZ, zoneEncode, zoneCircuit, zoneAssess, sigmoid };

    data: function () { return {

<script>
/* =====================================================================
 * voice.js : 음성 안내(TTS) + 자막 관리자
 * ---------------------------------------------------------------------
 * 왜 쓰는가 : 설명을 글과 목소리로 동시에, 친절하게 전달하기 위함임.
 * 검증된 방법 :
 *  1순위  미리 녹음한 MP3 (tools/make_voice.py, Microsoft Azure Neural
 *         음성 ko-KR-SunHiNeural 사용) → web/audio/<화면id>_<short|long>.mp3
 *  2순위  W3C Web Speech API(speechSynthesis) — 브라우저 표준 기능임.
 *         Edge의 "Microsoft SunHi/InJoon Online (Natural)" 신경망 음성,
 *         Chrome의 "Google 한국의" 음성을 우선 선택함.
 * 하는 일 : 문장 단위로 끊어 읽고, 지금 읽는 문장을 자막 줄에 표시함.
 * ===================================================================== */
(function (QP) {                                    // QP 이름공간에 음성 기능을 붙임
  "use strict";                                     // 엄격 모드를 켬
  const synth = window.speechSynthesis;             // 브라우저 표준 음성 합성기임(없을 수도 있음)
  const prefer = [/Natural/i, /Online/i, /Google/i, /SunHi/i, /InJoon/i, /Heami/i, /Yuna/i]; // 품질 좋은 음성 이름 우선순위임
  let queue = [], idx = 0, active = false, audio = null, rate = 1, chosen = null, onSub = null, onState = null, timer = null; // 재생 상태 변수들임

  function koreanVoices() {                         // 이 컴퓨터에 있는 한국어 음성 목록을 구함
    if (!synth) return [];                          // 음성 기능이 없는 브라우저면 빈 목록임
    return synth.getVoices().filter(function (v) { return /^ko/i.test(v.lang); }); // 언어 코드가 ko로 시작하는 것만 고름
  }
  function bestVoice() {                            // 가장 자연스러운 한국어 음성을 고름
    const list = koreanVoices();                    // 한국어 음성 목록임
    if (chosen) { const c = list.find(function (v) { return v.name === chosen; }); if (c) return c; } // 사용자가 고른 음성이 있으면 그것을 씀
    for (let k = 0; k < prefer.length; k++) {       // 우선순위 순서로 찾음
      const v = list.find(function (x) { return prefer[k].test(x.name); }); // 이름이 규칙에 맞는 음성을 찾음
      if (v) return v;                              // 찾으면 바로 돌려줌
    }
    return list[0] || null;                         // 없으면 첫 한국어 음성, 그것도 없으면 null임
  }
  function split(text) {                            // 긴 글을 문장 단위로 자름(자막과 끊김 방지용)
    return text.replace(/\s+/g, " ").split(/(?<=[.?!요다])\s+/).filter(function (s) { return s.trim().length; }); // 마침표, 물음표, ~요/~다 뒤에서 자름
  }
  function setSub(t) { if (onSub) onSub(t); }       // 자막 표시 함수(앱이 등록)를 호출함
  function setState(s) { if (onState) onState(s); } // 재생 상태(재생/정지)를 앱에 알림

  function stop() {                                 // 모든 음성을 멈춤
    active = false; queue = []; idx = 0;            // 대기열과 상태를 비움
    clearTimeout(timer);                            // 자막 넘김 타이머를 멈춤
    if (audio) { audio.pause(); audio = null; }     // MP3 재생 중이면 멈춤
    if (synth) synth.cancel();                      // 합성 음성도 취소함
    setSub("");                                     // 자막 줄을 기본 안내로 되돌림
    setState("stopped");                            // 정지 상태를 알림
  }
  function next() {                                 // 대기열의 다음 문장을 읽음
    if (!active || idx >= queue.length) { active = false; setState("done"); setSub(""); return; } // 다 읽었으면 끝냄
    const sentence = queue[idx++];                  // 다음 문장을 꺼냄
    setSub(sentence);                               // 자막 줄에 표시함
    const v = bestVoice();                          // 읽을 목소리를 고름
    if (!v || !window.SpeechSynthesisUtterance) {   // 음성이 없으면 자막만 시간에 맞춰 넘김
      timer = setTimeout(next, 260 * sentence.length / rate); // 글자 수에 비례해 잠시 기다림
      return;                                       // 음성 없이 진행함
    }
    const u = new SpeechSynthesisUtterance(sentence); // 한 문장짜리 음성 요청을 만듦
    u.voice = v; u.lang = v.lang; u.rate = .95 * rate; u.pitch = 1.02; // 목소리, 언어, 속도, 높이를 정함(살짝 느리고 밝게)
    u.onend = next;                                 // 다 읽으면 다음 문장으로 넘어감
    u.onerror = function () { timer = setTimeout(next, 200); }; // 오류가 나도 멈추지 않고 넘어감
    synth.speak(u);                                 // 읽기를 시작함
  }
  function speakTTS(text) {                         // 브라우저 TTS로 읽음
    stop();                                         // 이전 음성을 먼저 멈춤
    queue = split(text); idx = 0; active = true;    // 문장 대기열을 만들고 재생 상태로 바꿈
    setState("playing");                            // 재생 상태를 알림
    next();                                         // 첫 문장부터 읽기 시작함
  }
  // id의 MP3가 있으면 MP3로, 없으면 TTS로 읽음
  function play(id, text) {
    stop();                                         // 이전 음성을 멈춤
    const a = new Audio("audio/" + id + ".mp3");    // 미리 녹음한 파일을 열어 봄
    a.playbackRate = rate;                          // 재생 속도를 맞춤
    let started = false;                            // 실제 재생이 시작됐는지 기록함
    a.onerror = function () { if (!started) speakTTS(text); }; // 파일이 없으면 TTS로 대신 읽음
    a.onplaying = function () {                     // MP3 재생이 시작되면
      started = true; active = true; setState("playing"); // 상태를 바꿈
      const sents = split(text), total = text.length; let acc = 0; // 자막 시간 배분을 준비함
      const dur = (a.duration || total / 7) * 1000; // 파일 길이(초)를 밀리초로 바꿈
      sents.forEach(function (s) {                  // 문장마다 표시 시각을 예약함
        const at = dur * acc / total / rate; acc += s.length; // 글자 수 비율로 시작 시각을 정함
        setTimeout(function () { if (audio === a) setSub(s); }, at); // 그 시각에 자막을 바꿈
      });
    };
    a.onended = function () { active = false; setSub(""); setState("done"); }; // 끝나면 정리함
    audio = a;                                      // 현재 재생 중인 파일로 기록함
    a.play().catch(function () { if (!started) speakTTS(text); }); // 자동 재생이 막히면 TTS로 대신함
  }
  function pause() {                                // 일시정지함
    if (audio) audio.pause();                       // MP3를 멈춤
    if (synth) synth.pause();                       // TTS를 멈춤
    setState("paused");                             // 상태를 알림
  }
  function resume() {                               // 이어서 재생함
    if (audio) audio.play();                        // MP3를 이어감
    if (synth) synth.resume();                      // TTS를 이어감
    setState("playing");                            // 상태를 알림
  }

  if (synth) synth.onvoiceschanged = function () { if (QP.Voice.onVoices) QP.Voice.onVoices(); }; // 음성 목록이 늦게 오면 앱에 알림

  QP.Voice = {                                      // 다른 파일에서 쓸 기능을 공개함
    play: play, speak: speakTTS, stop: stop, pause: pause, resume: resume, koreanVoices: koreanVoices, bestVoice: bestVoice,
    setRate: function (r) { rate = r; if (audio) audio.playbackRate = r; }, // 속도를 바꿈
    setVoice: function (name) { chosen = name; },   // 사용자가 고른 음성 이름을 저장함
    onSubtitle: function (f) { onSub = f; },        // 자막 표시 함수를 등록함
    onStateChange: function (f) { onState = f; },   // 상태 표시 함수를 등록함
    isActive: function () { return active; },       // 지금 읽는 중인지 알려 줌
    onVoices: null                                  // 음성 목록 변경 알림 함수 자리임
  };
})(window.QP = window.QP || {});                    // QP 이름공간을 넘김

</script>                              <!-- 음성, 자막 관리자임 -->
<script>
/* =====================================================================
 * charts.js : 캔버스 그림 도구 (외부 라이브러리 없이)
 * ---------------------------------------------------------------------
 * 왜 쓰는가 : 인터넷 없이도(file://) 그래프가 그려지도록 직접 그림.
 * 하는 일   : 결정 지도(열지도), 막대그래프, 꺾은선그래프를 그림.
 * ===================================================================== */
(function (QP) {                                    // QP 이름공간에 그림 기능을 붙임
  "use strict";                                     // 엄격 모드를 켬

  function prep(cv, h) {                            // 캔버스를 화면 배율에 맞게 준비함
    const dpr = window.devicePixelRatio || 1;       // 고해상도 화면 배율임
    const w = cv.clientWidth || 300;                // 화면에 보이는 폭임
    const hh = h || cv.clientHeight || 200;         // 높이를 정함
    cv.width = Math.round(w * dpr); cv.height = Math.round(hh * dpr); // 실제 픽셀 수를 배율만큼 늘림
    cv.style.height = hh + "px";                    // 화면 높이를 고정함
    const g = cv.getContext("2d");                  // 그리기 도구를 얻음
    g.setTransform(dpr, 0, 0, dpr, 0, 0);           // 이후 좌표를 화면 픽셀 기준으로 씀
    g.font = "11px Malgun Gothic, sans-serif";      // 글꼴을 정함
    return { g: g, w: w, h: hh };                   // 도구와 크기를 돌려줌
  }
  function mix(a, b, t) {                           // 두 색(RGB 배열)을 t 비율로 섞음
    return "rgb(" + a.map(function (v, i) { return Math.round(v + (b[i] - v) * t); }).join(",") + ")"; // 각 채널을 선형 보간함
  }
  const LOW = [251, 246, 236], MID = [233, 196, 140], HIGH = [169, 72, 42]; // 낮음=종이색, 중간=황토, 높음=단풍색

  // 결정 지도: grid(점수 2차원), thr(경보 기준), opts.truth(정답 경계 함수), opts.mark([x,y] 현재 위치)
  function heatmap(cv, grid, thr, opts) {
    const o = opts || {}, P = prep(cv, o.height), g = P.g; // 옵션과 도구를 준비함
    const pad = 26, W = P.w - pad - 6, H = P.h - pad - 6, n = grid.length; // 여백과 그림 크기임
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) { // 모든 칸을 칠함
      const v = grid[r][c];                         // 칸의 점수임
      const t = v < thr ? .5 * v / thr : .5 + .5 * (v - thr) / Math.max(1e-6, 1 - thr); // 경보 기준을 색의 한가운데(황토)에 맞춤 → 경보 영역이 뚜렷이 보임
      g.fillStyle = t < .5 ? mix(LOW, MID, t * 2) : mix(MID, HIGH, (t - .5) * 2); // 기준 아래는 종이색→황토, 위는 황토→단풍색
      g.fillRect(pad + c * W / n, 4 + r * H / n, W / n + 1, H / n + 1); // 칸을 칠함
    }
    g.strokeStyle = o.color || "#6e4c82"; g.lineWidth = 2.4; // 경보 경계선 색과 굵기임
    for (let r = 0; r < n; r++) for (let c = 0; c < n - 1; c++) { // 가로 이웃 칸 사이를 검사함
      if ((grid[r][c] >= thr) !== (grid[r][c + 1] >= thr)) { // 기준을 넘고 안 넘는 경계면
        g.beginPath(); g.arc(pad + (c + 1) * W / n, 4 + (r + .5) * H / n, 1.5, 0, 7); g.stroke(); // 경계점에 점을 찍음
      }
    }
    for (let c = 0; c < n; c++) for (let r = 0; r < n - 1; r++) { // 세로 이웃 칸 사이도 검사함
      if ((grid[r][c] >= thr) !== (grid[r + 1][c] >= thr)) { // 경계면
        g.beginPath(); g.arc(pad + (c + .5) * W / n, 4 + (r + 1) * H / n, 1.5, 0, 7); g.stroke(); // 점을 찍음
      }
    }
    if (o.truth) {                                  // 정답 위험 경계(점선)를 그림
      g.setLineDash([5, 4]); g.strokeStyle = "#2e2420"; g.lineWidth = 1.5; g.beginPath(); // 점선 설정임
      let first = true;                             // 첫 점 여부임
      for (let k = 0; k <= 60; k++) {               // 가로축을 60등분해서 따라감
        const a = k / 60, b = o.truth(a);           // a에서 정답 경계의 b 값을 구함
        if (b == null || b > 1 || b < 0) continue;  // 그림 밖이면 건너뜀
        const px = pad + a * W, py = 4 + (1 - b) * H; // 화면 좌표로 바꿈
        if (first) { g.moveTo(px, py); first = false; } else g.lineTo(px, py); // 선을 이어 그림
      }
      g.stroke(); g.setLineDash([]);                // 선을 그리고 점선을 끔
    }
    if (o.mark) {                                   // 현재 상황 위치를 표시함
      const px = pad + o.mark[0] * W, py = 4 + (1 - o.mark[1]) * H; // 화면 좌표임
      g.fillStyle = "#fff"; g.strokeStyle = "#2e2420"; g.lineWidth = 2; // 흰 원에 검은 테두리임
      g.beginPath(); g.arc(px, py, 6, 0, 7); g.fill(); g.stroke(); // 원을 그림
    }
    g.fillStyle = "#6d5e55";                        // 축 글씨 색임
    g.fillText(o.xLabel || "x →", pad, P.h - 6);    // 가로축 이름임
    g.save(); g.translate(11, 4 + H); g.rotate(-Math.PI / 2); g.fillText(o.yLabel || "y →", 0, 0); g.restore(); // 세로축 이름(세워서)임
  }

  // 막대그래프: groups=[{label, values:[...]}], series=[{name,color}]
  function bars(cv, groups, series, opts) {
    const o = opts || {}, P = prep(cv, o.height), g = P.g; // 도구를 준비함
    const left = 34, bottom = 22, W = P.w - left - 8, H = P.h - bottom - 8; // 여백과 크기임
    const max = o.max || 1;                         // 세로축 최댓값임
    g.strokeStyle = "#e8d7bd"; g.fillStyle = "#6d5e55"; // 눈금선과 글씨 색임
    for (let t = 0; t <= 4; t++) {                  // 눈금 5개를 그림
      const y = 8 + H - H * t / 4;                  // 눈금 높이임
      g.beginPath(); g.moveTo(left, y); g.lineTo(left + W, y); g.stroke(); // 가로 눈금선임
      g.fillText(o.fmt ? o.fmt(max * t / 4) : (max * t / 4).toFixed(2), 2, y + 4); // 눈금 숫자임
    }
    const gw = W / groups.length, bw = Math.min(28, (gw - 16) / series.length); // 묶음 폭과 막대 폭임
    groups.forEach(function (gr, i) {               // 묶음마다
      gr.values.forEach(function (v, j) {           // 막대마다
        const x = left + i * gw + (gw - bw * series.length) / 2 + j * bw, h = H * Math.max(0, v) / max; // 막대 위치와 높이임
        g.fillStyle = series[j].color; g.fillRect(x, 8 + H - h, bw - 3, h); // 막대를 칠함
        g.fillStyle = "#2e2420"; g.fillText(o.fmt ? o.fmt(v) : v.toFixed(2), x - 2, 8 + H - h - 3); // 막대 위 숫자임
      });
      g.fillStyle = "#6d5e55"; g.fillText(gr.label, left + i * gw + 6, P.h - 6); // 묶음 이름임
    });
  }

  // 꺾은선그래프: lines=[{values, color}]
  function line(cv, lines, opts) {
    const o = opts || {}, P = prep(cv, o.height), g = P.g; // 도구를 준비함
    const left = 36, W = P.w - left - 8, H = P.h - 26; // 여백과 크기임
    let max = o.max != null ? o.max : 0, min = o.min != null ? o.min : Infinity, len = 1; // 축 범위를 구할 변수임
    lines.forEach(function (l) { l.values.forEach(function (v) { if (o.max == null) max = Math.max(max, v); if (o.min == null) min = Math.min(min, v); }); len = Math.max(len, l.values.length); }); // 범위를 계산함
    if (!isFinite(min)) min = 0; if (max === min) max = min + 1; // 빈 자료와 평평한 자료를 처리함
    g.strokeStyle = "#e8d7bd"; g.fillStyle = "#6d5e55"; // 눈금 색임
    for (let t = 0; t <= 3; t++) { const v = min + (max - min) * t / 3, y = 6 + H - H * t / 3; g.beginPath(); g.moveTo(left, y); g.lineTo(left + W, y); g.stroke(); g.fillText(o.fmt ? o.fmt(v) : v.toFixed(2), 2, y + 4); } // 눈금 4개를 그림
    lines.forEach(function (l) {                    // 선마다
      g.strokeStyle = l.color; g.lineWidth = 2.2; g.beginPath(); // 선 색과 굵기임
      l.values.forEach(function (v, i) { const x = left + W * i / Math.max(1, len - 1), y = 6 + H - H * (v - min) / (max - min); if (i) g.lineTo(x, y); else g.moveTo(x, y); }); // 점을 이어 그림
      g.stroke();                                   // 선을 그림
    });
    if (o.xLabel) g.fillText(o.xLabel, left, P.h - 4); // 가로축 이름임
  }

  QP.Charts = { heatmap: heatmap, bars: bars, line: line, prep: prep }; // 그림 기능을 공개함
})(window.QP = window.QP || {});                    // QP 이름공간을 넘김

</script>                             <!-- 캔버스 그림 도구임 -->
<script>

(function (QP) {                                    // QP 이름공간에 화면 목록을 붙임
  "use strict";                                     // 엄격 모드를 켬
  const S = QP.Sim, D = QP.Data, M = QP.Models, C = QP.Charts; // 자주 쓰는 모듈을 짧은 이름으로 씀
  const pct = function (v) { return (v * 100).toFixed(1) + "%"; }; // 0.379 → "37.9%"
  const $ = function (sel, root) { return (root || document).querySelector(sel); }; // 요소 하나를 찾는 짧은 함수임
  const COL = { linear: "#4d6b8c", quantum: "#6e4c82", analytic: "#c38a2b", shots: "#c76b67" }; // 방식별 고정 색임

  const State = QP.State = QP.State || { results: null, custom: null, customName: "" }; // 화면들이 함께 쓰는 상태 저장소임
  const byKey = function (k) { return State.results.find(function (m) { return m.key === k; }); }; // 결과에서 방식 하나를 찾음
  const go = function (id) { if (QP.App) QP.App.go(id); }; // 다른 화면으로 이동하는 함수임

  const imgSrc = function (n) { return (window.QP_IMG && window.QP_IMG[n]) || "img/" + n; }; // 사진 주소(한 파일 묶음본이면 내장 사진)를 고름

  /* ===== 1. 한눈에 보기 ===== */
  function home(el) {
    const L = byKey("linear"), Q = byKey("quantum"); // 일반, 양자 결과를 꺼냄
    el.innerHTML =                                  // 화면 내용을 한 번에 넣음(고정 문구라 안전함)
      '<div class="grid v-home">' +
      '<div class="hero card"><div><p class="eyebrow">실버 산행안전 × 양자 에뮬레이팅</p>' +
      '<h2>위험이 <span class="c-maple">겹치는 순간</span>을<br>양자 회로로 한 숫자에 담아 봐요</h2>' +
      '<p style="margin-top:10px;font-size:15px">일반 컴퓨터에서 양자컴퓨터의 계산을 흉내 내는 <b>에뮬레이터</b>로, 같은 데이터를 <b class="c-dusk">일반 AI</b>와 <b class="c-plum">양자 특징 AI</b>에 넣고 무엇이 달라지는지 비교합니다.</p>' +
      '<div class="btns" style="margin-top:12px"><button class="primary" data-go="kid">처음이라면: 동전으로 배우기</button><button data-go="compare">바로 비교 보기</button><button data-go="sim">가상 산행 재생</button></div></div>' +
      '<img src="' + imgSrc("ridge.jpg") + '" alt="늦가을 능선을 걷는 가상의 산행자(AI 생성 이미지)"></div>' +
      '<div class="cards4">' +
      '<div class="card tint-rose"><h3>양자가 뭐예요?</h3><p>돌고 있는 동전처럼 0과 1의 <b>가능성</b>을 함께 가진 계산 칸(큐비트)을 씁니다. 두 칸을 <b>얽으면</b> 서로의 결과가 함께 움직입니다.</p></div>' +

      '<div class="card tint-plum"><h3>얼마나 달라졌나</h3><p>같은 오경보 예산에서 위험 탐지율</p><p class="kpi"><span class="c-dusk">' + pct(L.recall) + '</span> <span class="arrow">→</span> <span class="c-plum">' + pct(Q.recall) + '</span></p><p class="small">합성 시험 ' + L.P + '건 기준, AUC ' + L.auc.toFixed(3) + ' → ' + Q.auc.toFixed(3) + '</p></div>' +
      '<div class="card tint-ochre"><h3>정직한 한계</h3><p>이 작은 회로는 <b>일반 수식(cos 곱)과 같은 값</b>이라 대조군도 같은 성적입니다. 이득은 “겹침 특징” 덕분이며, 양자 고유 이점은 큰 회로와 실측에서 확인할 과제입니다.</p></div>' +

    el.querySelectorAll("[data-go]").forEach(function (b) { b.onclick = function () { go(b.dataset.go); }; }); // 버튼을 누르면 해당 화면으로 이동함
  }

  /* ===== 2. 양자 쉽게 이해하기 (동전 놀이 6장) ===== */
  function coinSVG(p1, label, w) {                  // 돌아가는 동전 그림(SVG 글자)을 만듦. p1 = 뒷면(1) 확률
    const rx = 46 * Math.max(.12, Math.abs(1 - 2 * p1)); // 확률이 반반에 가까울수록 옆으로 선 동전(얇은 타원)처럼 그림
    const col = p1 < .5 ? "#a9482a" : "#6e4c82";   // 앞면 쪽이면 단풍색, 뒷면 쪽이면 자두색임
    return '<svg viewBox="0 0 120 130" width="' + (w || 120) + '"><ellipse cx="60" cy="58" rx="' + rx.toFixed(1) + '" ry="46" fill="' + col + '" opacity=".88"/>' + // 동전 몸통임
      '<text x="60" y="64" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">' + (rx > 20 ? (p1 < .5 ? "0" : "1") : "") + '</text>' + // 넓게 보이면 숫자를 씀
      '<text x="60" y="124" text-anchor="middle" font-size="12" fill="#2e2420">' + label + '</text></svg>'; // 아래 이름표임
  }
  function kid(el) {
    let page = 0, theta = 60;                       // 현재 쪽과 동전 기울기(도)임
    const pages = [                                 // 6장의 그림과 글을 만드는 함수 목록임
      function () { return { pic: '<div class="row">' + coinSVG(0, "앞면 = 0", 130) + coinSVG(1, "뒷면 = 1", 130) + '</div>',
        h: "1. 일반 컴퓨터는 탁자 위 동전", t: "<p>일반 컴퓨터의 한 칸(비트)은 탁자 위에 놓인 동전처럼 <b>앞면(0)</b> 아니면 <b>뒷면(1)</b>, 둘 중 하나만 기억해요.</p><p>스마트워치의 심박, GPS 위치도 결국 이런 0과 1로 저장돼요.</p>" }; },
      function () { const p = Math.pow(Math.sin(theta * Math.PI / 360), 2); return { pic: '<div class="stack" style="justify-items:center">' + coinSVG(p, "돌고 있는 동전(큐비트)", 170) + '<label style="width:260px">기울기 <input id="kTheta" type="range" min="0" max="180" value="' + theta + '"></label><p class="kpi"><span class="c-maple">0: ' + pct(1 - p) + '</span>, <span class="c-plum">1: ' + pct(p) + '</span></p></div>',
        h: "2. 큐비트는 돌고 있는 동전", t: "<p>양자컴퓨터의 한 칸(<b>큐비트</b>)은 빙글빙글 도는 동전 같아요. 아직 0인지 1인지 정해지지 않았지만, <b>얼마나 기울어져 도는지</b>에 따라 0이 나올 가능성과 1이 나올 가능성이 정해져 있어요. 이것을 <b>중첩</b>이라고 불러요.</p><p>슬라이더로 기울기를 바꿔 보세요. 이 회전을 <b>RY 게이트</b>라고 해요. 우리 프로그램은 “비가 얼마나 오는지”를 이 기울기로 바꿔 넣어요.</p>" }; },
      function () { return { pic: '<div class="stack" style="justify-items:center"><canvas id="kHist" style="width:320px"></canvas><div class="btns"><button id="kCatch" class="primary">동전 100번 잡아 보기</button><button id="kCatch1">1번만 잡기</button></div><p id="kOut" class="small"></p></div>',
        h: "3. 측정은 동전을 탁 잡는 것", t: "<p>도는 동전을 손으로 <b>탁 잡으면</b> 그 순간 0이나 1 하나로 정해져요. 이것이 <b>측정</b>이에요. 한 번 잡아서는 가능성을 알 수 없어요.</p><p>그래서 진짜 양자컴퓨터는 같은 계산을 수백, 수천 번 반복해서(<b>샷</b>) 몇 번 1이 나왔는지 세요. 에뮬레이터는 반복하지 않고 가능성을 <b>정확히</b> 계산할 수도 있어요.</p>" }; },

    function upd() {                                // 슬라이더나 단계가 바뀌면 다시 계산함

  }

  /* ===== 8. 양자와 AI 학습 ===== */
  function learn(el) {
    let model = M.vqcCreate(2, 3), timer = null;    // 2층 VQC와 학습 타이머임
    const train = M.vqcData(11, 160), test = M.vqcData(12, 400); // 학습, 시험 표본임
    el.innerHTML = '<div class="grid" style="grid-template-columns:1.05fr 1fr">' +
      '<div class="stack"><div class="card tint-dusk"><h3>방식 A, 이 프로그램의 기본: “회로는 특징, 학습은 AI”</h3><p>신호 <span class="arrow">→</span> <b>고정 2큐비트 회로</b>(학습 안 함) <span class="arrow">→</span> 겹침 점수 6개 <span class="arrow">→</span> <b>로지스틱 회귀가 학습</b> <span class="arrow">→</span> 위험 점수</p><p class="small">회로는 계산기처럼 입력을 바꾸기만 함. 학습되는 것은 22개 특징의 가중치임. (양자 커널, 특징 맵 방식: Havlíček 2019)</p></div>' +
      '<div class="card tint-plum"><h3>방식 B, 변분 양자 회로(VQC): “회로의 각도도 학습”</h3><p>신호 <span class="arrow">→</span> 회로(<b>학습되는 각도 θ</b> 포함) <span class="arrow">→</span> 측정 <span class="arrow">→</span> 오차 계산 <span class="arrow">→</span> <b>매개변수 이동 규칙</b>으로 θ 기울기 계산 <span class="arrow">→</span> θ 수정 (반복)</p><p class="small">∂⟨Z⟩/∂θ = [⟨Z⟩(θ+π/2) − ⟨Z⟩(θ−π/2)] / 2 → 실제 양자 장비에서도 그대로 쓰는 정확한 미분법(Mitarai 2018, Schuld 2019).</p></div>' +
      '<div class="card qa"><h3>자주 묻는 질문</h3><p><b>Q. 양자로 하면 학습은 안 하나요?</b> 방식 A는 회로가 아닌 AI가 학습하고, 방식 B는 회로 자체가 학습함. 둘 다 “데이터로 학습”함.</p><p><b>Q. 그럼 양자가 AI를 대신하나요?</b> 아님. 양자 회로는 AI 안의 <b>한 부품</b>(특징 만들기 또는 분류기)임. 안전 규칙과 고전 AI는 그대로 유지됨.</p><p><b>Q. 메타러너와는?</b> 코스, 사람 집단을 과제로 삼아 θ의 좋은 시작점을 메타학습(FOMAML)하면, 적은 데이터로 빠르게 적응하는 2단계 실험이 됨.</p></div></div>' +
      '<div class="card stack"><div class="row" style="justify-content:space-between"><h3>방식 B 실습: VQC가 배우는 모습</h3><div class="btns"><button id="vStart" class="primary">학습 시작</button><button id="vStopT">멈춤</button><button id="vReset">초기화</button></div></div>' +
      '<div class="row" style="gap:18px"><span>반복 <b id="vEp">0</b></span><span>손실 <b id="vLoss">-</b></span><span>시험 정확도 <b id="vAcc" class="c-plum">-</b></span><span class="small" id="vTh"></span></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><p class="small">VQC 위험 지도(점선 = 정답 경계 비×경사=0.42)</p><canvas id="vMap"></canvas></div><div><p class="small">손실 곡선(낮을수록 잘 배움)</p><canvas id="vLossC"></canvas></div></div>' +
      '<p class="small">2큐비트, 학습 각도 4개 + 후처리 2개, 학습 표본 160개, 시험 400개. 처음에는 엉뚱한 지도에서 시작해서, 반복할수록 오른쪽 위 모서리(비와 경사가 함께 높은 곳)를 위험으로 배움.</p></div></div>';
    function draw() {                               // 현재 VQC 상태를 그림
      const g = 28, grid = [];                      // 지도 칸 수와 배열임
      for (let r = 0; r < g; r++) { const row = []; for (let c = 0; c < g; c++) row.push(M.vqcPredict(model, c / (g - 1), 1 - r / (g - 1))); grid.push(row); } // 칸마다 VQC 점수를 계산함
      const h = Math.max(180, Math.min($("#vMap", el).clientWidth, el.clientHeight - 260)); // 그림 높이(정사각형에 가깝게)임
      C.heatmap($("#vMap", el), grid, .5, { height: h, truth: function (a) { return a > .42 ? .42 / a : null; }, xLabel: "비 →", yLabel: "경사 →" }); // 위험 지도를 그림
      C.line($("#vLossC", el), [{ values: model.loss.length ? model.loss : [0.7], color: "#6e4c82" }], { height: h, min: 0, xLabel: "반복 횟수 →" }); // 손실 곡선을 그림
      $("#vEp", el).textContent = model.epoch;      // 반복 횟수를 씀
      $("#vLoss", el).textContent = model.loss.length ? model.loss[model.loss.length - 1].toFixed(3) : "-"; // 최근 손실을 씀
      $("#vAcc", el).textContent = pct(M.vqcAccuracy(model, test)); // 시험 정확도를 씀
      $("#vTh", el).textContent = "θ = [" + model.theta.map(function (t) { return t.toFixed(2); }).join(", ") + "]"; // 학습된 각도를 보여 줌
    }
    function stop() { clearInterval(timer); timer = null; } // 학습을 멈춤
    $("#vStart", el).onclick = function () { if (timer) return; timer = setInterval(function () { for (let k = 0; k < 3; k++) M.vqcStep(model, train, .8); draw(); if (model.epoch >= 240) stop(); }, 60); }; // 조금씩 학습하며 그림을 갱신함
    $("#vStopT", el).onclick = stop;                // 멈춤 버튼임
    $("#vReset", el).onclick = function () { stop(); model = M.vqcCreate(2, 3); draw(); }; // 초기화 버튼임
    requestAnimationFrame(draw);                    // 처음 그림을 그림
    return stop;                                    // 화면을 떠나면 학습을 멈춤
  }

  /* ===== 9. 큐비트와 메모리 ===== */
  function scale(el) {
    const fmt = function (b) { const u = ["B", "KB", "MB", "GB", "TB", "PB", "EB"]; let i = 0; while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; } return b.toFixed(b < 10 ? 1 : 0) + " " + u[i]; }; // 바이트를 읽기 쉬운 단위로 바꿈
    el.innerHTML = '<div class="grid" style="grid-template-columns:1fr 1fr">' +
      '<div class="card stack"><h3>큐비트 수를 바꿔 보세요</h3><input id="mN" type="range" min="1" max="50" value="20"><p class="kpi c-plum" id="mK"></p><p id="mT"></p>' +
      '<table>' + [4, 10, 20, 30, 40, 50].map(function (n) { return '<tr><td>' + n + '큐비트</td><td>진폭 ' + Math.pow(2, n).toLocaleString("ko-KR") + '개</td><td><b>' + fmt(S.memoryBytes(n)) + '</b></td></tr>'; }).join("") + '</table>' +
      '<p class="small">진폭 1개 = 복소수(실수 8B + 허수 8B) = 16바이트 기준임. 노트북 메모리 16GB로는 약 30큐비트가 상태벡터 방식의 한계임.</p></div>' +
      '<div class="card stack"><div class="row" style="justify-content:space-between"><h3>이 컴퓨터에서 직접 재기</h3><button id="mRun" class="primary">측정 시작</button></div><canvas id="mC"></canvas><p id="mOut" class="small">각 큐비트에 RY 1번 + CNOT 사슬을 적용하는 데 걸리는 시간을 4~22큐비트에서 잼.</p>' +
      '<div class="card tint-plum"><b>그래서 무엇이 다른가?</b><p class="small">에뮬레이터: 정확하지만 큐비트마다 2배씩 무거워짐. 실제 양자 장비: 큐비트가 늘어도 상태를 물리적으로 담지만, 결과는 샷으로만 읽고 잡음이 있음. 우리 과제는 작은 회로(2~4큐비트)라 에뮬레이터로 충분히 정확하며, 실제 장비 연동은 3차년도 시범연구 범위임.</p></div></div></div>';
    const n = $("#mN", el);                         // 큐비트 슬라이더임
    function upd() { const k = Number(n.value); $("#mK", el).textContent = k + "큐비트 → " + fmt(S.memoryBytes(k)); $("#mT", el).textContent = "진폭 " + Math.pow(2, k).toLocaleString("ko-KR") + "개를 저장해야 함. 1개 늘리면 " + fmt(S.memoryBytes(k + 1)) + "."; } // 메모리를 계산해 씀
    n.oninput = upd; upd();                         // 슬라이더를 연결하고 처음 값을 씀
    $("#mRun", el).onclick = function () {          // 측정 버튼임
      const ns = [4, 8, 12, 14, 16, 18, 20, 22], times = []; let k = 0; // 잴 큐비트 수와 결과 배열임
      $("#mOut", el).textContent = "측정 중…";      // 진행 표시임
      (function stepRun() {                         // 한 번에 하나씩 재서 화면이 멈추지 않게 함
        if (k >= ns.length) { C.line($("#mC", el), [{ values: times, color: "#a9482a" }], { height: 190, xLabel: "4, 8, 12, 14, 16, 18, 20, 22 큐비트 →", fmt: function (v) { return v.toFixed(0) + "ms"; } }); $("#mOut", el).textContent = ns.map(function (q, i) { return q + "q: " + times[i].toFixed(1) + "ms"; }).join(", ") + " → 2큐비트 늘 때마다 약 4배."; return; } // 끝나면 그림을 그림
        const q = ns[k], st = S.createState(q), t0 = performance.now(); // 상태를 만들고 시각을 잼
        for (let i = 0; i < q; i++) S.ry(st, i, .3); for (let i = 0; i < q - 1; i++) S.cx(st, i, i + 1); // 회로를 실행함
        times.push(performance.now() - t0); k++; setTimeout(stepRun, 10); // 시간을 기록하고 다음으로 감
      })();
    };
  }

      '<div class="card stack"><h3>① 합성 데이터 만들기</h3><div class="slider"><span>씨앗(seed)</span><input id="dSeed" type="number" value="2026"><span></span></div><div class="slider"><span>표본 수</span><input id="dN" type="number" value="2750"><span></span></div>' +

      '<div class="card stack"><h3>② 공개 데이터 CSV 올리기</h3><input type="file" id="dFile" accept=".csv"><p id="dUp" class="small">열 이름은 아래 20개 신호 이름(0~1)과 선택 label(0/1)임. 없는 열은 0으로, label이 없으면 합성 규칙으로 채움.</p><div class="mono" style="font-size:11.5px;line-height:1.5">' + D.signals.map(function (s) { return '<span title="' + s[1] + '">' + s[2] + '</span>'; }).join(", ") + ', label</div><table id="dPrev" style="font-size:11.5px"></table></div>' +
      '<div class="card stack"><h3>③ 공개 데이터 연결(파이썬)</h3><table style="font-size:12px"><tr><th>출처</th><th>→ 신호</th></tr><tr><td>기상청 ASOS 시간자료(공공데이터포털 API)</td><td>rain, wind, heat, ice</td></tr><tr><td>산림청 등산로 공간정보, GPX</td><td>slope, delay</td></tr><tr><td>국립공원공단 탐방로, 통제 정보</td><td>closed, rockfall</td></tr><tr><td>한국천문연구원 일출몰 API</td><td>sunset</td></tr><tr><td>아이나비 DTO-1 생체(워치)</td><td>hr_load, fatigue</td></tr></table>' +
      '<pre class="mono">cd /d D:\\QP\npython -m qp.data.public --asos asos.csv --gpx trail.gpx --out data\\public\\merged.csv\npython -m qp.data.synthetic --seed 2026 --n 2750</pre><p class="small">GitHub Actions(.github/workflows/synthetic-data.yml)가 매주 월요일 합성 데이터와 성적표를 새로 만들어 저장소에 올림.</p></div></div>';
    let last = null;                                // 마지막으로 만든 표본 목록임
    function split(rows, name) {                    // 표본을 학습, 기준, 시험으로 나눠 상태에 저장함
      const a = Math.floor(rows.length * .5), b = Math.floor(rows.length * .7); // 나눌 위치임
      State.custom = { train: rows.slice(0, a), valid: rows.slice(a, b), test: rows.slice(b) }; State.customName = name; // 저장함
    }
    function preview(rows) {                        // 앞 5줄을 표로 보여 줌
      const cols = [3, 9, 0, 1, 8, 11];             // 보여 줄 대표 신호 6개임
      $("#dPrev", el).innerHTML = '<tr>' + cols.map(function (c) { return '<th>' + D.signals[c][2] + '</th>'; }).join("") + '<th>label</th></tr>' + rows.slice(0, 5).map(function (r) { return '<tr>' + cols.map(function (c) { return '<td>' + r.x[c].toFixed(2) + '</td>'; }).join("") + '<td>' + r.label + '</td></tr>'; }).join(""); // 표를 채움
    }
    $("#dMake", el).onclick = function () {         // 만들기 버튼임

      const pos = last.filter(function (r) { return r.label; }).length; // 위험 표본 수를 셈
      $("#dStat", el).innerHTML = "표본 <b>" + last.length + "</b>개, 위험 <b>" + pos + "</b>개(" + pct(pos / last.length) + ")"; // 통계를 씀
      split(last, "합성 seed " + $("#dSeed", el).value); preview(last); // 상태에 저장하고 미리 보기를 그림

        window.claude.use("downloads").then(function (dl) { if (dl) return dl.save({ filename: name, data: csv }); $("#dStat", el).textContent = "이 화면에서는 내려받기가 막혀 있음. D:\\QP에서 run.bat으로 열어 주세요."; }).catch(function () { }); // 거절해도 조용히 넘어감
        return;                                     // 일반 링크 방식은 쓰지 않음
      }
      const a = document.createElement("a");        // 내려받기용 링크를 만듦
      a.href = URL.createObjectURL(new Blob(["\ufeff" + D.toCSV(last)], { type: "text/csv" })); // 엑셀에서 한글이 안 깨지도록 BOM을 붙임
      a.download = "synthetic_seed" + $("#dSeed", el).value + ".csv"; a.click(); // 파일 이름을 정하고 내려받음
    };
    $("#dUse", el).onclick = function () { if (!State.custom) $("#dMake", el).onclick(); State.dataName = State.customName; State.results = M.experiment({ data: State.custom, shots: 100, noise: .15 }); go("bench"); }; // 성적표로 이동해 이 데이터로 실험함
    $("#dFile", el).onchange = function (e) {       // CSV 파일을 고르면

      const rd = new FileReader();                  // 파일 읽기 도구임
      rd.onload = function () {                     // 다 읽으면
        const res = D.fromCSV(String(rd.result).replace(/^\ufeff/, "")); // BOM을 지우고 표본으로 바꿈

      };
      rd.readAsText(f, "utf-8");                    // 글자로 읽음
    };

<script>
/* =====================================================================
 * app.js : 프로그램 시작점 — 메뉴, 화면 전환, 음성 막대 연결
 * ---------------------------------------------------------------------
 * 왜 쓰는가 : 왼쪽 메뉴를 누르면 오른쪽 한 화면만 바꿔 그리고,
 *            어느 화면에서든 같은 음성 막대로 설명을 듣게 하기 위함임.
 * 하는 일   : (1) 기본 비교 실험을 한 번 실행 (2) 메뉴 생성
 *            (3) 주소의 #화면id로 화면 이동 (4) 음성 버튼, 자막 연결
 * ===================================================================== */
(function (QP) {                                    // QP 이름공간에 앱 기능을 붙임
  "use strict";                                     // 엄격 모드를 켬
  const $ = function (id) { return document.getElementById(id); }; // id로 요소를 찾는 짧은 함수임
  const State = QP.State = QP.State || {};          // 화면들이 함께 쓰는 상태임
  State.results = QP.Models.experiment();           // 페이지를 열면 같은 합성 데이터로 세 방식을 학습, 시험함
  State.dataName = "기본 합성";                     // 현재 데이터 이름임
  let current = null, cleanup = null;               // 현재 화면과, 떠날 때 실행할 정리 함수임

  /* ---------- 1. 메뉴 만들기 ---------- */
  const menu = $("menu");                           // 메뉴 자리를 찾음
  let lastGroup = "";                               // 직전 그룹 이름임
  QP.Views.forEach(function (v) {                   // 화면마다 메뉴 항목을 만듦
    if (v.group !== lastGroup) {                    // 그룹이 바뀌면
      const h = document.createElement("h4"); h.textContent = v.group; menu.appendChild(h); lastGroup = v.group; // 그룹 이름을 씀
    }
    const a = document.createElement("a");          // 메뉴 링크를 만듦
    a.href = "#" + v.id; a.dataset.id = v.id;       // 주소 끝을 #화면id로 정함(뒤로가기 지원)
    a.innerHTML = '<i style="background:' + v.color + '"></i>' + v.title; // 색 점과 제목을 넣음
    menu.appendChild(a);                            // 메뉴에 추가함
  });

  /* ---------- 2. 화면 전환 ---------- */
  function show(id) {                               // 화면 id로 오른쪽을 다시 그림
    const v = QP.Views.find(function (x) { return x.id === id; }) || QP.Views[0]; // 없는 id면 첫 화면을 씀
    if (cleanup) { try { cleanup(); } catch (e) { } cleanup = null; } // 이전 화면의 타이머 등을 정리함
    QP.Voice.stop();                                // 이전 화면의 음성을 멈춤
    current = v;                                    // 현재 화면으로 기록함
    $("viewGroup").textContent = v.group;           // 그룹 이름을 씀
    $("viewTitle").textContent = v.title;           // 제목을 씀
    document.querySelectorAll("#menu a").forEach(function (a) { a.classList.toggle("cur", a.dataset.id === v.id); }); // 현재 메뉴를 강조함
    const el = $("view");                           // 내용 자리임
    el.innerHTML = ""; el.scrollTop = 0;            // 비우고 맨 위로 올림
    cleanup = v.render(el) || null;                 // 화면을 그리고 정리 함수를 받아 둠
    document.title = v.title + ", 산행안전 양자 실험실 v02"; // 탭 제목을 바꿈
    if ($("autoVoice").checked) readShort();        // 자동 안내를 켰으면 짧은 안내를 읽음
  }
  function route() { show((location.hash || "#home").slice(1)); } // 주소의 #뒤를 읽어 화면을 고름
  window.addEventListener("hashchange", route);     // 메뉴를 누르거나 뒤로가기하면 화면을 바꿈

  /* ---------- 3. 음성 ---------- */
  function script() { return QP.Narration.get(current.id, State.results); } // 현재 화면의 대본을 얻음
  function canUseMp3() { return State.dataName === "기본 합성"; } // 녹음 파일의 숫자는 기본 데이터 기준이므로 그때만 MP3를 씀
  function readShort() {                            // 짧은 안내를 읽음
    const t = current.id === "sim" && State.simNarr ? State.simNarr : script().short; // 시뮬레이션 화면은 현재 단계 설명을 읽음
    if (canUseMp3() && current.id !== "sim") QP.Voice.play(current.id + "_short", t); else QP.Voice.speak(t); // 녹음이 있으면 녹음으로, 없으면 TTS로 읽음
  }
  function readLong() {                             // 긴 설명을 읽음
    const t = script().long;                        // 긴 대본임
    if (canUseMp3()) QP.Voice.play(current.id + "_long", t); else QP.Voice.speak(t); // 같은 원칙으로 읽음
  }
  $("btnShort").onclick = readShort;                // 짧은 안내 버튼임
  $("btnLong").onclick = readLong;                  // 긴 설명 버튼임
  $("vPlay").onclick = function () { if ($("vPlay").dataset.state === "paused") QP.Voice.resume(); else readLong(); }; // 멈춘 상태면 이어서, 아니면 긴 설명을 처음부터 읽음
  $("vPause").onclick = QP.Voice.pause;             // 일시정지 버튼임
  $("vStop").onclick = QP.Voice.stop;               // 정지 버튼임
  $("vRate").onchange = function (e) { QP.Voice.setRate(Number(e.target.value)); }; // 속도를 바꿈
  $("vVoice").onchange = function (e) { QP.Voice.setVoice(e.target.value); }; // 목소리를 바꿈
  QP.Voice.onSubtitle(function (t) { $("sub").textContent = t || "▶를 누르면 이 화면을 목소리와 자막으로 설명해 드려요."; }); // 자막 줄에 현재 문장을 표시함
  QP.Voice.onStateChange(function (s) {             // 재생 상태가 바뀌면
    $("vPlay").dataset.state = s;                   // 재생 버튼에 상태를 기록함
    document.querySelector(".voicebar").classList.toggle("playing", s === "playing"); // 읽는 중에는 자막을 강조함
  });
  function fillVoices() {                           // 한국어 목소리 목록을 채움
    const list = QP.Voice.koreanVoices(), best = QP.Voice.bestVoice(); // 목록과 추천 목소리임
    $("vVoice").innerHTML = list.length ? list.map(function (v) { return '<option' + (best && v.name === best.name ? " selected" : "") + '>' + v.name + '</option>'; }).join("") : "<option>한국어 음성 없음(자막만)</option>"; // 선택 상자를 채움
  }
  QP.Voice.onVoices = fillVoices;                   // 목록이 늦게 와도 다시 채움
  fillVoices();                                     // 처음에 한 번 채움

  QP.App = { go: function (id) { location.hash = id; }, readLong: readLong, readShort: readShort }; // 다른 파일에서 쓸 기능을 공개함
  route();                                          // 첫 화면을 그림
})(window.QP = window.QP || {});                    // QP 이름공간을 넘김

</script>                                <!-- 메뉴, 음성 막대를 연결하고 시작함 -->
</body>
</html>
